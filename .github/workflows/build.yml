name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # No MAPBOX_TOKEN here on purpose: this verifies that the project
      # type-checks and bundles, not that the map renders. Rendering needs a
      # credential, which does not belong in a public build.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          retention-days: 7
